[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
